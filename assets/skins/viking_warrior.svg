    <!-- Boots -->
    <rect x="20" y="56" width="24" height="8" fill="#8B4513"/>
    <rect x="20" y="56" width="2" height="8" fill="#F5F5DC"/>
    <rect x="30" y="56" width="2" height="8" fill="#F5F5DC"/>
    <rect x="40" y="56" width="2" height="8" fill="#F5F5DC"/>
    <!-- Rune Patterns -->
    <rect x="24" y="20" width="2" height="2" fill="#000000"/>
    <rect x="38" y="20" width="2" height="2" fill="#000000"/>
    <rect x="24" y="28" width="2" height="2" fill="#000000"/>
